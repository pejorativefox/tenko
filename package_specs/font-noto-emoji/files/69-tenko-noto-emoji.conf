<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Tenko: monochrome emoji as a weak fallback for the generic families.
       The color face is preferred by font-noto-color-emoji on the desktop;
       this face exists so the kmscon console and minimal installs still draw
       a glyph. -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Emoji</string>
    </edit>
  </match>
</fontconfig>
