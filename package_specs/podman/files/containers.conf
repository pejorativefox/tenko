# Tenko container engine configuration for podman built from source.
#
# See containers.conf(5).  Helper paths are not set here: podman's built-in
# defaults already find every helper where the Tenko packages install it
#   crun          /usr/bin/crun                    (runtime search list)
#   conmon        /usr/libexec/podman/conmon       (conmon_path default)
#   netavark,
#   aardvark-dns,
#   catatonit     /usr/libexec/podman/             (helper_binaries_dir default)
#   pasta         /usr/bin/pasta                   (looked up in $PATH)

[engine]
runtime = "crun"
# cgroupfs works with both the unified and the legacy hierarchy and does not
# depend on a systemd user session with cgroup delegation, which rootless
# podman in build containers, SSH sessions and the image builders cannot
# rely on.  The Tenko build scripts set no resource limits, so they lose
# nothing to it.  Set cgroup_manager = "systemd" in a drop-in under
# /etc/containers/containers.conf.d/ or ~/.config/containers/ to use
# systemd scopes (needed for --cgroups=split and quadlet resource limits).
cgroup_manager = "cgroupfs"
# conmon and podman are built with journald support.
events_logger = "journald"

[containers]
log_driver = "journald"
