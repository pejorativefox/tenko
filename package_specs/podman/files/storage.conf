# Tenko containers/storage configuration.
#
# See containers-storage.conf(5).  graphroot and runroot are intentionally
# not set: podman resolves them per mode
#   rootful  -> /var/lib/containers/storage
#   rootless -> $XDG_DATA_HOME/containers/storage (~/.local/share/...)
# which is what the Tenko build scripts expect.

[storage]
driver = "overlay"

[storage.options.overlay]
# Native unprivileged overlay is supported by the Tenko kernel
# (CONFIG_OVERLAY_FS=m).  Do NOT set mount_program: a FUSE helper is slower
# and is not installed.  On a filesystem that cannot do native rootless
# overlay, install fuse-overlayfs and add
#   mount_program = "/usr/bin/fuse-overlayfs"
# to a local drop-in, not to this file.
ignore_chown_errors = "true"
