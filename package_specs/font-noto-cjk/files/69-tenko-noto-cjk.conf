<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Tenko: add the Simplified Chinese monospace face as a weak fallback to
       the generic families.  binding="weak" means a font that already covers
       a character (Terminus for Latin, for example) keeps priority; the CJK
       face is used only for characters the requested font lacks. -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>
</fontconfig>
