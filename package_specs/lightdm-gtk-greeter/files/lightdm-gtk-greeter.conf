[greeter]
# Match the desktop: Arc-Dark widgets, Kora symbolic icons and a plain black
# backdrop.  Kora supplies the symbolic icons the greeter's indicators look
# up (preferences-desktop-accessibility-symbolic, system-shutdown-symbolic,
# document-properties-symbolic); hicolor alone leaves those buttons blank.
background=#000000
user-background=false
theme-name=Arc-Dark
icon-theme-name=kora
