# Tenko live ISO: mount the squashfs root and use an overlayfs upper.
# dmsquash-live pulls in squashfs, loop, iso9660, dm, overlayfs and img-lib.
# tenko-ventoy exposes an ISO stored on a Ventoy data partition to
# dmsquash-live (Ventoy boots the ISO's own systemd-boot, so the kernel
# cannot see the ISO file itself).
add_dracutmodules+=" dmsquash-live pollcdrom tenko-ventoy "
