# Tenko containers/storage configuration for the static podman bundle
# under /opt/podman (podman 6.1.4, mgoltzsche/podman-static).
#
# See containers-storage.conf(5).  graphroot and runroot are intentionally
# not set: podman 6 resolves them per mode
#   rootful  -> /var/lib/containers/storage
#   rootless -> $XDG_DATA_HOME/containers/storage (~/.local/share/...)
# which is what the Tenko build scripts expect.

[storage]
driver = "overlay"

[storage.options.overlay]
# Native unprivileged overlay is supported by the Tenko kernel
# (7.2.6, CONFIG_OVERLAY_FS=m).  Do NOT set mount_program: the upstream
# bundle's storage.conf.d drop-in points it at a non-/opt FUSE helper path,
# which both forces the slower FUSE path and does not exist on Tenko.
# fuse-overlayfs remains available at
# /opt/podman/bin/fuse-overlayfs as a manual fallback for filesystems that
# cannot do native rootless overlay; enable it by adding
#   mount_program = "/opt/podman/bin/fuse-overlayfs"
# to a local drop-in, not to this file.
ignore_chown_errors = "true"
