# Browneye container engine configuration for the static podman bundle
# under /opt/podman (podman 6.1.4, mgoltzsche/podman-static).
#
# See containers.conf(5).  Paths point into /opt/podman, the stable symlink
# maintained by the podman-bin RPM.

[engine]
# All helpers ship inside the bundle; use them explicitly instead of relying
# on PATH lookups.
runtime = "crun"
conmon_path = ["/opt/podman/libexec/conmon"]
helper_binaries_dir = ["/opt/podman/libexec"]
# The bundle's podman is built without the systemd tag.  cgroupfs works with
# both the unified hierarchy and the legacy one; builds do not set limits.
cgroup_manager = "cgroupfs"
events_logger = "file"

[engine.runtimes]
crun = ["/opt/podman/bin/crun"]
runc = ["/opt/podman/bin/runc"]

[containers]
# The bundled conmon is compiled without journald support (no systemd tag).
# podman defaults to journald when systemd is present, and the first
# container start would then fail with
#   conmon: Include journald in compilation path to log to systemd journal
# k8s-file is therefore mandatory with the static bundle.
log_driver = "k8s-file"
