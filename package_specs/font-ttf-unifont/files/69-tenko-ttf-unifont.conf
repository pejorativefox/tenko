<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Tenko: GNU Unifont is the final fallback.  It covers every BMP code
       point, so characters that Terminus, DejaVu Sans Mono, the Nerd Fonts
       symbol face and the Noto faces all leave empty still render instead of
       tofu.  Examples are U+2B1D (the small squares in a TUI footer) and
       U+23F5 (media skip).  This file sorts after the other 69-tenko
       snippets and the append is weak, so Unifont stays last in the family
       chain and is only reached when nothing else has the glyph. -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Unifont</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="spacing" compare="eq"><const>mono</const></test>
    <edit name="family" mode="append" binding="weak">
      <string>Unifont</string>
    </edit>
  </match>
</fontconfig>
