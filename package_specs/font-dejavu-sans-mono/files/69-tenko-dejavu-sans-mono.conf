<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Tenko: append DejaVu Sans Mono weakly so it supplies the Dingbats,
       Miscellaneous Symbols and Geometric Shapes codepoints that Terminus
       and the Nerd Fonts symbol faces do not cover.  It sorts before the
       Noto CJK and emoji snippets, so a character covered by both DejaVu and
       Noto CJK (for example U+25D1) keeps DejaVu's single-cell metric
       instead of the double-width CJK glyph. -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>
  <!-- Terminals and toolkits commonly request a concrete family (for example
       "Terminus (TTF)") instead of the generic "monospace".  Append the
       symbol face to any pattern that declares monospaced spacing as well,
       so those requests get the same fallback instead of whatever fontconfig
       happens to return first. -->
  <match target="pattern">
    <test name="spacing" compare="eq"><const>mono</const></test>
    <edit name="family" mode="append" binding="weak">
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>
</fontconfig>
