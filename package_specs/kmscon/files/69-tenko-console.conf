<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Tenko: the kmscon console family.  An explicit family list keeps the
       monochrome emoji face ahead of Noto Color Emoji (the color face cannot
       be rendered by kmscon's 8-bit freetype coverage buffer) without
       affecting the desktop's normal monospace fallback. -->
  <match target="pattern">
    <test qual="any" name="family"><string>Tenko Console</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans Mono CJK SC</string>
      <string>DejaVu Sans Mono</string>
      <string>Noto Emoji</string>
      <string>Symbols Nerd Font Mono</string>
    </edit>
  </match>
</fontconfig>
