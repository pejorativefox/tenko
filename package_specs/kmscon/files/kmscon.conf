# Tenko console defaults.
#
# "Tenko Console" is a fontconfig alias shipped in
# /etc/fonts/conf.d/69-tenko-console.conf.  It resolves to Noto Sans Mono CJK
# SC, with the monochrome Noto Emoji and Nerd Fonts symbol faces appended as
# fallbacks.  kmscon's freetype backend uses fontconfig per glyph, so the one
# family covers Latin, Simplified Chinese, emoji and Nerd Font icons.
font-name=Tenko Console
